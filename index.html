<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Phishing URL Detector</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI, Arial, sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#0f172a,#1e293b,#020617);
color:white;
}

.container{
width:500px;
background:#1e293b;
padding:40px;
border-radius:12px;
box-shadow:0 20px 40px rgba(0,0,0,0.6);
text-align:center;
}

h1{
font-size:28px;
margin-bottom:10px;
}

.subtitle{
color:#94a3b8;
margin-bottom:25px;
}

.input-group{
display:flex;
gap:10px;
}

input{
flex:1;
padding:12px;
border-radius:8px;
border:none;
outline:none;
font-size:15px;
}

button{
padding:12px 18px;
border:none;
border-radius:8px;
background:#6366f1;
color:white;
font-size:15px;
cursor:pointer;
transition:0.3s;
}

button:hover{
background:#4f46e5;
}

.loader{
margin-top:20px;
display:none;
}

.loader span{
width:10px;
height:10px;
background:white;
display:inline-block;
border-radius:50%;
margin:3px;
animation:bounce 1s infinite alternate;
}

.loader span:nth-child(2){animation-delay:0.2s;}
.loader span:nth-child(3){animation-delay:0.4s;}

@keyframes bounce{
to{transform:translateY(-10px);}
}

.result{
margin-top:20px;
padding:18px;
border-radius:10px;
display:none;
text-align:left;
}

.safe{
background:#16a34a;
}

.phishing{
background:#dc2626;
}

.result-title{
font-size:18px;
font-weight:bold;
margin-bottom:6px;
}

.reason{
font-size:14px;
opacity:0.9;
}

</style>
</head>

<body>

<div class="container">

<h1>AI Phishing Detector</h1>
<p class="subtitle">Scan URLs using GenAI Security Analysis</p>

<div class="input-group">
<input type="text" id="urlInput" placeholder="Enter website URL...">
<button onclick="scanURL()">Scan</button>
</div>

<div class="loader" id="loader">
<span></span>
<span></span>
<span></span>
</div>

<div id="resultBox" class="result">
<div class="result-title" id="prediction"></div>
<div class="reason" id="reason"></div>
</div>

</div>

<script>

const API_URL = "https://phishing-rag-api-2.onrender.com/detect";

async function scanURL(){

const url = document.getElementById("urlInput").value;

const loader = document.getElementById("loader");
const resultBox = document.getElementById("resultBox");
const prediction = document.getElementById("prediction");
const reason = document.getElementById("reason");

if(url === ""){
alert("Please enter a URL");
return;
}

loader.style.display="block";
resultBox.style.display="none";

try{

const response = await fetch(API_URL,{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({url:url})
});

const data = await response.json();

loader.style.display="none";
resultBox.style.display="block";

if(data.prediction === "PHISHING"){
resultBox.className="result phishing";
prediction.innerHTML="⚠️ PHISHING DETECTED";
}else{
resultBox.className="result safe";
prediction.innerHTML="✅ SAFE WEBSITE";
}

reason.innerHTML="Reason: " + data.reason;

}catch(error){

loader.style.display="none";
resultBox.style.display="block";
resultBox.className="result phishing";

prediction.innerHTML="Error";
reason.innerHTML="Could not connect to API.";

}

}

</script>

</body>
</html>
