<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Phishing URL Detector</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI, sans-serif;
}

body{
height:100vh;
background:linear-gradient(135deg,#0f172a,#1e293b,#020617);
display:flex;
justify-content:center;
align-items:center;
color:white;
}

.container{
width:520px;
background:#1e293b;
padding:40px;
border-radius:16px;
box-shadow:0 20px 40px rgba(0,0,0,0.5);
text-align:center;
}

h1{
font-size:30px;
margin-bottom:10px;
}

.subtitle{
color:#94a3b8;
margin-bottom:30px;
}

.input-group{
display:flex;
gap:10px;
}

input{
flex:1;
padding:14px;
border-radius:8px;
border:none;
font-size:15px;
outline:none;
}

button{
padding:14px 20px;
border:none;
border-radius:8px;
background:#6366f1;
color:white;
font-size:15px;
cursor:pointer;
transition:0.3s;
}

button:hover{
background:#4f46e5;
}

.loader{
margin-top:25px;
display:none;
}

.loader span{
width:12px;
height:12px;
background:white;
display:inline-block;
border-radius:50%;
margin:3px;
animation:bounce 1s infinite alternate;
}

.loader span:nth-child(2){animation-delay:0.2s;}
.loader span:nth-child(3){animation-delay:0.4s;}

@keyframes bounce{
to{
transform:translateY(-12px);
}
}

.result-card{
margin-top:25px;
padding:20px;
border-radius:12px;
display:none;
font-size:18px;
}

.safe{
background:#16a34a;
}

.phishing{
background:#dc2626;
}

footer{
margin-top:20px;
font-size:12px;
color:#94a3b8;
}

</style>

</head>

<body>

<div class="container">

<h1>AI Phishing Detector</h1>
<p class="subtitle">GenAI RAG Powered URL Security Scanner</p>

<div class="input-group">
<input type="text" id="urlInput" placeholder="Enter website URL...">
<button onclick="scanURL()">Scan</button>
</div>

<div class="loader" id="loader">
<span></span>
<span></span>
<span></span>
</div>

<div id="result" class="result-card"></div>

<footer>
Cybersecurity AI Project
</footer>

</div>

<script>

const API_URL = "https://phishing-rag-api-2.onrender.com/detect";

async function scanURL(){

const url = document.getElementById("urlInput").value;

const loader = document.getElementById("loader");
const result = document.getElementById("result");

if(url === ""){
alert("Please enter a URL");
return;
}

loader.style.display="block";
result.style.display="none";

try{

const response = await fetch(API_URL,{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
url:url
})
});

const data = await response.json();

loader.style.display="none";
result.style.display="block";

if(data.prediction === "PHISHING"){

result.className="result-card phishing";
result.innerHTML="⚠️ Phishing Website Detected";

}else{

result.className="result-card safe";
result.innerHTML="✅ Safe Website";

}

}catch(err){

loader.style.display="none";
result.style.display="block";
result.className="result-card phishing";
result.innerHTML="❌ API connection error";

}

}

</script>

</body>
</html>
